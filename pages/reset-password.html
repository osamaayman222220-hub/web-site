<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور | رعايه CareNest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body style="background:var(--off-white); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">

<div style="background:white; border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); padding:40px; max-width:440px; width:100%; text-align:center;">
  <div style="font-size:3rem; margin-bottom:12px;">🔑</div>

  <!-- STEP 1: Request Reset Email -->
  <div id="request-section">
    <h1 style="font-size:1.6rem; font-weight:800; color:var(--gray-900); margin-bottom:8px;">استعادة كلمة المرور</h1>
    <p style="color:var(--gray-500); font-size:0.9rem; margin-bottom:28px;">أدخل بريدك الإلكتروني المسجل وسنرسل لك رابطاً لإعادة تعيين كلمة المرور</p>

    <form id="reset-form">
      <div class="form-group" style="text-align:right; margin-bottom:20px;">
        <label class="form-label" for="reset-email" data-i18n="auth_email">البريد الإلكتروني</label>
        <input type="email" id="reset-email" class="form-control" placeholder="example@carenest.com" required>
      </div>

      <button type="submit" class="btn btn-primary w-full" id="reset-btn" data-i18n="auth_send_reset">
        إرسال رابط الاستعادة
      </button>

      <div id="reset-success" class="hidden" style="background:var(--success-bg); color:#065f46; border-radius:var(--radius); padding:14px; margin-top:16px; font-size:0.9rem; text-align:right;">
        <div style="font-weight:700; margin-bottom:6px;">✅ تم إرسال الرابط إلى بريدك الإلكتروني!</div>
        <div id="reset-success-hint" style="font-weight:400; font-size:0.85rem; margin-top:6px; color:#047857;"></div>
      </div>

      <div id="reset-error" class="hidden" style="background:var(--error-bg); color:#991b1b; border-radius:var(--radius); padding:14px; margin-top:16px; font-weight:600; font-size:0.9rem;">
        <span id="reset-error-text"></span>
      </div>
    </form>
  </div>

  <!-- STEP 2: Set New Password (after clicking email link) -->
  <div id="update-section" class="hidden">
    <h1 style="font-size:1.6rem; font-weight:800; color:var(--gray-900); margin-bottom:8px;">تعيين كلمة مرور جديدة</h1>
    <p style="color:var(--gray-500); font-size:0.9rem; margin-bottom:28px;">أدخل كلمة المرور الجديدة لحسابك</p>

    <form id="update-password-form">
      <div class="form-group" style="text-align:right; margin-bottom:16px;">
        <label class="form-label" for="new-password">كلمة المرور الجديدة <span class="required">*</span></label>
        <input type="password" id="new-password" class="form-control" placeholder="8 أحرف على الأقل" minlength="8" required autocomplete="new-password">
      </div>

      <div class="form-group" style="text-align:right; margin-bottom:20px;">
        <label class="form-label" for="confirm-password">تأكيد كلمة المرور <span class="required">*</span></label>
        <input type="password" id="confirm-password" class="form-control" placeholder="أعد إدخال كلمة المرور" minlength="8" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary w-full" id="update-btn">
        تحديث كلمة المرور
      </button>

      <div id="update-success" class="hidden" style="background:var(--success-bg); color:#065f46; border-radius:var(--radius); padding:14px; margin-top:16px; font-weight:600; font-size:0.9rem;">
        ✅ تم تحديث كلمة المرور بنجاح! جاري تحويلك...
      </div>

      <div id="update-error" class="hidden" style="background:var(--error-bg); color:#991b1b; border-radius:var(--radius); padding:14px; margin-top:16px; font-weight:600; font-size:0.9rem;">
        <span id="update-error-text"></span>
      </div>
    </form>
  </div>

  <p style="margin-top:24px; font-size:0.9rem;">
    <a href="login.html" style="color:var(--primary); font-weight:600;">← العودة لتسجيل الدخول</a>
  </p>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/utils.js"></script>
<script>
  // ──────────────────────────────────────────────────────────────
  // استعادة كلمة المرور — CareNest
  // يعمل مع Supabase v2 (PKCE + implicit flow)
  // ──────────────────────────────────────────────────────────────

  // 1. التقاط معلمات URL بشكل متزامن قبل أن تُنظِّفها Supabase
  (function () {
    const _hash   = window.location.hash  || '';
    const _search = window.location.search || '';
    const _params = new URLSearchParams(_search);

    // هل وصل المستخدم عبر رابط استعادة؟
    window.__careRecoveryFlow =
      _hash.includes('type=recovery') ||
      _hash.includes('access_token')  ||
      _params.get('type') === 'recovery' ||
      _params.has('code');

    // هل يحتوي الرابط على رسالة خطأ (otp_expired …)؟
    window.__careRecoveryError =
      _params.get('error_code') ||
      _params.get('error')      ||
      (_hash.includes('error_code=') && _hash.replace(/^#/, '').split('&').find(p => p.startsWith('error_code='))?.split('=')[1]) ||
      null;
  })();

  // ──────────────────────────────────────────────────────────────
  // مساعدات العرض
  // ──────────────────────────────────────────────────────────────
  function showUpdateSection() {
    document.getElementById('request-section').classList.add('hidden');
    document.getElementById('update-section').classList.remove('hidden');
  }

  function showRequestSection() {
    document.getElementById('request-section').classList.remove('hidden');
    document.getElementById('update-section').classList.add('hidden');
  }

  function showLinkError(msg) {
    showRequestSection();
    const errEl   = document.getElementById('reset-error');
    const errText = document.getElementById('reset-error-text');
    if (errEl && errText) {
      errText.textContent = msg;
      errEl.classList.remove('hidden');
    }
  }

  // ──────────────────────────────────────────────────────────────
  // تهيئة صفحة الاستعادة
  // ──────────────────────────────────────────────────────────────
  (function initRecoveryPage() {
    const sb = window.getSupabase ? window.getSupabase() : null;

    // إذا كان الرابط يحمل خطأ (مثل otp_expired) أظهره فوراً
    if (window.__careRecoveryError) {
      const code = window.__careRecoveryError;
      if (code === 'otp_expired' || code.includes('expired')) {
        showLinkError('انتهت صلاحية رابط الاستعادة. يرجى إدخال بريدك أدناه وطلب رابط جديد.');
      } else {
        showLinkError('رابط الاستعادة غير صالح أو مستخدم مسبقاً. يرجى طلب رابط جديد.');
      }
      return;
    }

    if (!sb) {
      // إذا لم يكن الموقع متصلاً بـ Supabase أظهر نموذج الطلب فقط
      showRequestSection();
      return;
    }

    // ──── تسجيل المُستمع أولاً قبل أي عملية async ────
    sb.auth.onAuthStateChange(function (event, session) {
      if (event === 'PASSWORD_RECOVERY') {
        // الحالة الصحيحة: وصل المستخدم برابط استعادة صالح
        showUpdateSection();
      } else if (event === 'SIGNED_IN' && window.__careRecoveryFlow) {
        // احتياطي: بعض إصدارات Supabase ترسل SIGNED_IN بدلاً من PASSWORD_RECOVERY
        showUpdateSection();
      }
      // لا نفعل شيئاً على SIGNED_OUT هنا كي لا نُخفي النموذج بعد تحديث كلمة المرور
    });

    // ──── فحص الجلسة الحالية كاحتياطي ────
    // في حالة أن detectSessionInUrl=true عالج الرمز قبل تسجيل المُستمع
    sb.auth.getSession().then(function (res) {
      var session = res && res.data && res.data.session;
      if (session && window.__careRecoveryFlow) {
        showUpdateSection();
      }
    }).catch(function () {
      // تجاهل أخطاء الجلسة هنا
    });
  })();

  // ──────────────────────────────────────────────────────────────
  // الخطوة 1: إرسال رابط الاستعادة
  // ──────────────────────────────────────────────────────────────
  document.getElementById('reset-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email   = document.getElementById('reset-email').value.trim();
    const btn     = document.getElementById('reset-btn');
    const succEl  = document.getElementById('reset-success');
    const errEl   = document.getElementById('reset-error');
    const errText = document.getElementById('reset-error-text');

    succEl.classList.add('hidden');
    errEl.classList.add('hidden');
    setButtonLoading(btn, true);

    try {
      await Auth.sendPasswordReset(email);
      succEl.classList.remove('hidden');

      // اعرض تعليمات مناسبة حسب بيئة التشغيل
      const hintEl = document.getElementById('reset-success-hint');
      if (hintEl) {
        const isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        if (isLocal) {
          hintEl.textContent = '⚠️ تعمل محلياً: افتح الرابط في هذا المتصفح بينما Live Server يعمل، ولا تغلق النافذة.';
        } else {
          hintEl.textContent = 'افتح بريدك الإلكتروني واضغط على الرابط خلال 60 دقيقة.';
        }
      }

      Toast.success('تم إرسال رابط الاستعادة إلى بريدك الإلكتروني');
    } catch (err) {
      const msg = err?.message || 'حدث خطأ أثناء الإرسال';
      errText.textContent = msg;
      errEl.classList.remove('hidden');
      Toast.error(msg);
    } finally {
      setButtonLoading(btn, false);
    }
  });

  // ──────────────────────────────────────────────────────────────
  // الخطوة 2: تعيين كلمة المرور الجديدة
  // ──────────────────────────────────────────────────────────────
  document.getElementById('update-password-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const newPass     = document.getElementById('new-password').value;
    const confirmPass = document.getElementById('confirm-password').value;
    const btn         = document.getElementById('update-btn');
    const succEl      = document.getElementById('update-success');
    const errEl       = document.getElementById('update-error');
    const errText     = document.getElementById('update-error-text');

    succEl.classList.add('hidden');
    errEl.classList.add('hidden');

    if (newPass.length < 8) {
      errText.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
      errEl.classList.remove('hidden');
      return;
    }

    if (newPass !== confirmPass) {
      errText.textContent = 'كلمتا المرور غير متطابقتين';
      errEl.classList.remove('hidden');
      return;
    }

    setButtonLoading(btn, true);

    try {
      const sb = window.getSupabase();
      if (!sb) throw new Error('تعذر الاتصال بالخادم');

      const { error } = await sb.auth.updateUser({ password: newPass });
      if (error) throw error;

      succEl.classList.remove('hidden');
      Toast.success('تم تحديث كلمة المرور بنجاح ✅');

      setTimeout(function () {
        window.location.href = 'login.html';
      }, 2500);
    } catch (err) {
      const msg = err?.message || 'فشل تحديث كلمة المرور';
      errText.textContent = msg;
      errEl.classList.remove('hidden');
      Toast.error(msg);
    } finally {
      setButtonLoading(btn, false);
    }
  });
</script>

  <script src="../js/whatsapp.js"></script>
</body>
</html>
